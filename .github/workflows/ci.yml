name: AI Server CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  # 의존성 설치 + 앱 import 검증 + Docker 이미지 빌드 가능 여부 확인
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import check (openai 모드 기준)
        env:
          EMBEDDING_PROVIDER: openai
          LLM_PROVIDER: openai
        run: python -c "import app.main"

      - name: Docker build check (push 안 함)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
